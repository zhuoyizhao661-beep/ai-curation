<script>
const themes=[{"id":"ability","name":"AI 能力","en":"CAPABILITY","question":"AI 到底能做什么，什么时候不能信？","promise":"看懂能力的边界，少一点盲信。","intro":"从“看起来很聪明”走向对能力的具体判断。我们关注 AI 在什么任务上可靠、哪里容易出错，以及人们如何检验这些能力。","questions":["它是真的理解了，还是恰好答对了？","为什么同一个 AI，有时惊艳，有时失常？","模型的高分，离我的真实任务有多远？"]},{"id":"collaboration","name":"人机协作","en":"COLLABORATION","question":"怎样和 AI 把事情做好？","promise":"找到分工、表达与验收的方法。","intro":"从决定交给 AI 什么，到把意思说明白，再到判断结果能不能用。沿着一次合作的过程，找到适合自己的判断。","questions":[]},{"id":"self","name":"自我","en":"SELF","question":"有了 AI，我还想练什么、保留什么？","promise":"重新想一想学习、判断与自我。","intro":"当越来越多的事可以借助 AI 完成，我们如何学习、保持判断，以及理解自己的价值？这里关注技术进入生活后，发生在人身上的长期变化。","questions":["什么都能问 AI，我还需要怎样学习？","方便和依赖的界线，在哪里？","如果作品有 AI 参与，“我的”意味着什么？"]},{"id":"culture","name":"关系与文化","en":"RELATIONSHIPS & CULTURE","question":"AI 怎样改变我们与他人的连接和表达？","promise":"理解陪伴、创作与信任的变化。","intro":"AI 正在进入对话、创作和共同生活。我们关心人与人如何建立信任，也关心新的表达方式怎样改变审美和文化。","questions":["当 AI 总能接住我的话，陪伴发生了什么变化？","人人都能生成作品，什么还会打动我们？","难辨真假的内容，会怎样改变信任？"]},{"id":"economy","name":"工作与经济","en":"WORK & ECONOMY","question":"工作、价值和机会会流向哪里？","promise":"看清工作变化背后的利益与机会。","intro":"从一份工作的变化，看向组织、商业模式与价值分配。我们关注新能力怎样转化为机会，以及收益最终由谁获得。","questions":["AI 改变的，是一项任务还是一份职业？","当生产变得便宜，什么会变得更有价值？","更高的效率，最终让谁受益？"]},{"id":"governance","name":"权利与规则","en":"RIGHTS & RULES","question":"谁能决定 AI 如何进入我们的生活？","promise":"理解数据、权利与责任的边界。","intro":"当 AI 参与重要决定，谁有知情权、选择权和追责的途径？这里从具体处境出发，理解技术背后的规则与权力。","questions":["我的数据被怎样使用，我能否选择？","AI 出了错，谁需要承担责任？","哪些决定应该始终留给人？"]}],topics=[{"id":"delegate","theme":"collaboration","title":"什么事情值得交给 AI？","deck":"先拆开任务，再看质量、时间与返工。找到适合自己的分工，而不是一张万能清单。","label":"本期主打","status":"专题导读","rank":1,"updated":"2026-09-14","sources":["S001","S002","S003","S004","S007","S011"],"body":"\u003cp>“AI 很好用”和“用 AI 反而更累”，可能都来自真实体验。两个人做的任务不同，熟练程度不同，对结果的要求也不同。我们更值得追问的是：对我眼前这件事，怎样分工才划算？\u003c/p>\n\u003cp>先把“这件事”说具体。例如“准备一场分享”包含确定要讲的问题、寻找材料、核对事实、组织论证、制作视觉稿，以及现场表达。每一步对背景知识、判断和执行的要求不同。把整个过程一次交出去，很难知道哪一步带来了帮助，哪一步增加了负担。\u003c/p>\n\u003cp>\u003cstrong>本专题的暂时判断：以具体任务为单位，尝试不同的委托程度，同时检查结果与全程投入。\u003c/strong> 这是我们的策展建议，下面的材料帮助理解它的依据和边界。\u003c/p>\n\u003ch3>先看任务为什么不能一概而论\u003c/h3>\n\u003cp>\u003ca href=\"#/material/S001\">HBS 对“参差不齐的技术前沿”研究的解读\u003c/a>，适合作为短入口。758 名咨询顾问参与的实验提示，AI 对不同任务的帮助并不一致。\u003c/p>\n\u003cp>带着一个自己的任务读：它能拆成哪些步骤？其中哪些步骤已有清楚的判断标准？留意这项研究的时间和情境：它研究的是 2023 年的 GPT-4 与咨询任务，不能用其中的数字替你预测今天的工作收益。\u003c/p>\n\u003ch3>把反例与它的后续放在一起\u003c/h3>\n\u003cp>\u003ca href=\"#/material/S002\">METR 的早期 2025 开发者实验\u003c/a>观察到：在熟悉项目的 16 名开发者、246 项任务中，允许使用 AI 时完成任务耗时增加了 19%。这为“用了就会更快”的推断提供了一个具体反例。\u003c/p>\n\u003cp>但阅读不应停在这个数字。\u003ca href=\"#/material/S003\">2026 年的方法更新\u003c/a>说明后续实验受到参与者与任务选择等影响，难以可靠估计当时的提效幅度。\u003ca href=\"#/material/S011\">2026 年的自报调查\u003c/a>又把“做得更快”与“创造更多价值”分开讨论；它是问卷，不能直接与实验耗时比较。\u003c/p>\n\u003cp>带走的问题是：我说的“有用”究竟指更快、更轻松、质量更好，还是能做以前不会做的事？这些收益值得分别记录。\u003c/p>\n\u003ch3>一起做，比谁更好？\u003c/h3>\n\u003cp>\u003ca href=\"#/material/S004\">人机组合何时有用的元分析\u003c/a>，区分了两种比较：组合优于人独做，以及组合优于人和 AI 单独表现中的较强者。在它纳入的研究中，前者平均成立，后者平均不成立。\u003c/p>\n\u003cp>这项研究覆盖的是 2020 年至 2023 年 6 月的实验。我们用它来厘清评价基准，不据此判断当前所有 AI 的表现。\u003c/p>\n\u003cp>如果你关心的是“它有没有帮到我”，比较过去自己的做法就有意义。如果你要证明某种分工最优，就需要比较更多工作方式。人的参与还可能承载学习、责任或体验等目标，这些应另行说明。\u003c/p>\n\u003ch3>可选思考：给下一件任务选择委托方式\u003c/h3>\n\u003cp>下面的观察框架供你联系自己的任务思考，可任选一项，也可以跳过。它是尚待实践检验的策展建议。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>先问自己\u003c/th>\n\u003cth>可尝试的安排\u003c/th>\n\u003cth>应该留下什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>我能说明想得到什么吗？\u003c/td>\n\u003ctd>目标模糊时先共同探索，看到样例后再明确取舍\u003c/td>\n\u003ctd>目标变化与被放弃的方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>我能判断结果好不好吗？\u003c/td>\n\u003ctd>标准清楚时，尝试让 AI 完成一段独立任务\u003c/td>\n\u003ctd>可接受样例、验收条件、实际产物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>如果做错，我能发现并修正吗？\u003c/td>\n\u003ctd>易检查、易重做的任务，可逐步扩大委托范围\u003c/td>\n\u003ctd>错误、发现方式和返工代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>这次合作的收益是什么？\u003c/td>\n\u003ctd>把耗时、质量、体验和新能力分别观察\u003c/td>\n\u003ctd>完整过程记录，而非只截最好的输出\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>希望进一步理解委托层级，可选读 \u003ca href=\"#/material/S007\">Building effective agents\u003c/a> 中的定义和何时使用 Agent 部分。它提供工程实践视角；页面已提醒部分工具信息过时，这里只用来讨论固定流程与自主探索的取舍。\u003c/p>\n\u003ch3>我们现在理解到哪里\u003c/h3>\n\u003cp>我们有理由按任务和评价目标讨论协作效果；现有材料还不足以给普通读者一份稳定的“哪些工作必须交给 AI”清单。本期材料的技术工作与英语环境比重较高，中文写作、资料整理、活动策划等任务，需要补入更完整的经验。\u003c/p>\n\u003cp>仍想追问：成功委托、返工过多和完成原本做不到的事，分别需要什么条件？这些差别是否会改变你下一次的分工？\u003c/p>\n","minutes":5},{"id":"intention","theme":"collaboration","title":"为什么 AI 总是没懂我的意思？","deck":"缺的是提示词、共同背景，还是一个尚未想清楚的需求？从反复修改中找出问题。","label":"表达与背景","status":"阅读起点","rank":2,"updated":"2026-09-14","sources":["S005","S006","S008"],"body":"\u003cp>这个专题从“我明明说清楚了”出发，分别讨论缺少共同背景、表达含混，以及需求本来就在变化。我们会追问：好的协作是否一定始于一份完整的需求说明？\u003c/p>\n\u003cp>可以按以下顺序阅读：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>理解用户的困境。\u003c/strong> \u003ca href=\"#/material/S005\">Why Johnny Can’t Prompt\u003c/a> 用小样本用户研究呈现零散试错与过度推广的问题。先读摘要、引言；旧模型情境不等于当前用户的失败率。\u003c/li>\n\u003cli>\u003cstrong>盘点 AI 实际看到了什么。\u003c/strong> \u003ca href=\"#/material/S006\">Effective context engineering for AI agents\u003c/a> 将注意力放到指令、材料、示例和历史的组织。选读有效上下文部分，区分足够的信息与冗余的信息。\u003c/li>\n\u003cli>\u003cstrong>用结果标准反看需求。\u003c/strong> \u003ca href=\"#/material/S008\">Demystifying evals for AI agents\u003c/a> 的评估结构可以帮助我们写出可辨认的成功例子。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>仍待探索：\u003c/strong> 对同一件事，哪些背景和示例能减少误解，哪些信息反而干扰判断？我们暂不预设“越短越好”或“越详细越好”。\u003c/p>\n","minutes":2},{"id":"judgment","theme":"collaboration","title":"AI 做完了，我怎么知道能不能用？","deck":"从“看起来像成品”走向可以检查的结果。把事实、意图和表达分开判断。","label":"结果与判断","status":"阅读起点","rank":3,"updated":"2026-09-14","sources":["S008","S004","S009"],"body":"\u003cp>这个专题关注一个很日常的困境：产物已经很像成品，但自己不确定应该检查哪里。这里将“事实是否准确”“是否符合意图”“表达是否合适”分开讨论。\u003c/p>\n\u003cp>先从 S008 的\u003ca href=\"#/material/S008\">评估结构与判分方式\u003c/a>进入，再回看 S004 的\u003ca href=\"#/material/S004\">比较基准\u003c/a>。最后用 \u003ca href=\"#/material/S009\">知识工作者使用生成式 AI 时的思考活动研究\u003c/a>，讨论验证、整合与把握任务的劳动。S009 目前只读官方摘要；自报的思考活动不等于已测得的能力变化。\u003c/p>\n\u003cp>\u003cstrong>可选思考：\u003c/strong> 回看一份自己认可的 AI 产物：你确认了哪些事实？它省略了什么条件？如果另一个读者不认可，你们分歧的是准确性、目的还是表达？\u003c/p>\n","minutes":1}],sources=[{"id":"S001","title":"Navigating the Jagged Technological Frontier","by":"HBS AI Institute／Dell’Acqua 等","pub":"2023-09-21","kind":"研究机构解读","read":"机构解读已读；论文全文待精读","where":"Key Findings；Shifting the Debate","take":"758名咨询顾问的实验提示：不同任务的人机组合，效果不一致。用于建立“按任务判断”的起点。","limit":"2023年GPT-4与咨询任务。不能推定当下模型或所有职业的提效幅度。","topics":"T02-01","url":"https://aiinstitute.hbs.edu/navigating-the-jagged-technological-frontier/"},{"id":"S002","title":"Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity","by":"METR／Becker 等","pub":"2025-07-10","kind":"随机实验研究报告","read":"研究报告关键章节已读","where":"Methodology；Core Result；误读澄清","take":"16名熟悉各自项目的开发者、246项任务，允许使用AI时耗时增加19%。用于追问全程成本。","limit":"早期2025工具与特定开源场景。必须连同S003和S011阅读，不能写成“现在AI让开发者更慢”。","topics":"T02-01","url":"https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/"},{"id":"S003","title":"We are Changing our Developer Productivity Experiment Design","by":"METR／Becker 等","pub":"2026-02-24","kind":"研究方法更新","read":"开篇与选择效应章节已读","where":"开篇；Wider adoption of AI…","take":"后续实验受到参与者和任务选择、并行耗时统计等影响，不能可靠估计当前加速幅度。","limit":"这不是同口径证实“提效已逆转”的结论。与S002属于同一研究线。","topics":"T02-01","url":"https://metr.org/blog/2026-02-24-uplift-update/"},{"id":"S004","title":"When combinations of humans and AI are useful: A systematic review and meta-analysis","by":"Vaccaro、Almaatouq、Malone／Nature Human Behaviour","pub":"2024-10-28","kind":"同行评议元分析","read":"摘要、主文开篇及结果章节已读","where":"Abstract；Main；Overall levels；Heterogeneity","take":"106项实验区分两个基准：人机组合平均优于人独做，却未优于人或AI单独表现中的较强者。","limit":"纳入2020年至2023年6月研究，非当前Agent评测。不能把“优于人”写成“优于两者”。","topics":"T02-01、T02-03","url":"https://www.nature.com/articles/s41562-024-02024-1"},{"id":"S005","title":"Why Johnny Can’t Prompt: How Non-AI Experts Try (and Fail) to Design LLM Prompts","by":"Zamfirescu-Pereira 等／CHI 2023","pub":null,"pubText":"2023-04（会议月份）","kind":"用户研究论文","read":"摘要、引言与方法前段已读","where":"PDF第1–5页","take":"10名非专家设计聊天机器人的研究揭示：容易靠零散试错、类比对人下指令，并从少量结果过度推广。","limit":"特定原型与旧模型的小样本质性研究。用于识别交互困境，不能给出普通用户失败率。","topics":"T02-02","url":"https://people.eecs.berkeley.edu/~bjoern/papers/zamfirescu-johnny-chi2023.pdf"},{"id":"S006","title":"Effective context engineering for AI agents","by":"Anthropic Applied AI 团队","pub":"2025-09-29","kind":"厂商工程实践","read":"概念、有效上下文与检索章节已读","where":"Context engineering vs. prompt engineering；The anatomy of effective context","take":"有效信息包括指令、材料、示例与历史。围绕任务筛选相关信息，并根据失败补充。","limit":"工程经验，非通用提效实验。“信息精简”不等于越短越好，日常写作迁移需试验。","topics":"T02-02","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"id":"S007","title":"Building effective agents","by":"Anthropic","pub":"2024-12-19","kind":"厂商工程实践","read":"定义与何时使用Agent章节已读","where":"What are agents?；When (and when not) to use agents","take":"区分固定流程和模型自主决策，建议按需要增加复杂度。为任务委托层级提供实践视角。","limit":"页面已提示部分工具信息过时。只选工作方式判断，不用作当前产品操作教程。","topics":"T02-01","url":"https://www.anthropic.com/engineering/building-effective-agents"},{"id":"S008","title":"Demystifying evals for AI agents","by":"Anthropic","pub":"2026-01-09","kind":"厂商工程实践","read":"评估结构、判分方式与结论已读","where":"The structure of an evaluation；Types of graders；Conclusion","take":"验收需看真实结果，并可结合规则、模型与人工判断。结果陈述和实际完成状态要分开。","limit":"非“另一个AI验收就可靠”的证明。模型评分需要人的标准与校准。","topics":"T02-02、T02-03","url":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"},{"id":"S009","title":"The Impact of Generative AI on Critical Thinking","by":"Lee 等／Microsoft Research、CHI 2025","pub":null,"pubText":"2025-04（会议月份）","kind":"自报问卷研究","read":"官方摘要已读；全文待精读","where":"研究页面摘要","take":"319名知识工作者提供936个使用例子，描述验证信息、整合结果和管理任务等思考活动。","limit":"自报与相关关系，不证明AI导致思考能力退化。主归属协作，关联“自我”。","topics":"T02-03","url":"https://www.microsoft.com/en-us/research/publication/the-impact-of-generative-ai-on-critical-thinking-self-reported-reductions-in-cognitive-effort-and-confidence-effects-from-a-survey-of-knowledge-workers/"},{"id":"S010","title":"Claude Code团队亲授Loop和Workflow设计心法","by":"Onepod 编译／原节目 Peter Yang，嘉宾 Thariq Shihipar","pub":null,"pubText":"待核对原节目日期","kind":"播客编译线索","read":"中文编译已读；原节目待核验","where":"核心观点：先探索再固化；独立验收","take":"可提供非技术工作流的现场叙事。先核对原视频、演示条件和时间戳，再进入正式阅读路径。","limit":"二次编译不当作原始事实或独立实验。暂不采用产品功能和效果数字。","topics":"T02-02、T02-03","url":"https://onepod.site/p/CIunwVmVIiMy24kdNEpcKyHWnoc/","original":"https://www.youtube.com/watch?v=aVO6E181cNU"},{"id":"S011","title":"Measuring the Self-Reported Impact of Early-2026 AI on Technical Worker Productivity","by":"METR／Joel Becker","pub":"2026-05-11","kind":"自报问卷研究","read":"Summary 与测量局限已读","where":"Summary","take":"349名技术工作者的调查，区分完成原任务更快与创造更多价值。可用于扩展“值得交给AI”的衡量维度。","limit":"自报收益非实测因果效果。不能与S002的实验耗时直接拼成进步曲线。","topics":"T02-01","url":"https://metr.org/blog/2026-05-11-ai-usage-survey/"}],articles=[{"id":"S001","title":"AI 的能力，有一条参差不齐的边界","reason":"先理解任务差异，再决定把哪一步交出去。","sections":[["","同一个 AI，在一项工作中能帮上忙，换一项工作却可能让结果变差。讨论它是否有用时，任务本身是一个不能省略的条件。HBS 对“参差不齐的技术前沿”研究的解读，提供了理解这种差异的起点。"],["任务不是一整块","这项研究涉及 758 名咨询顾问，研究背景是 2023 年的 GPT-4 与咨询任务。机构解读呈现的一个关键观察是：不同任务上的人机组合，效果并不一致。我们不能只凭一种任务上的好表现，就认定它能胜任相邻的所有工作。"],["把判断放回具体步骤","以准备一场分享为例，寻找资料、检查出处、组织观点和制作视觉稿，是不同的工作。这个例子是我们对日常场景的延伸：如果只评价“AI 能不能准备分享”，许多真正重要的差异就被藏起来了。逐步检查产物，才有机会发现哪里省了力，哪里增加了核查成本。"],["带走一个判断起点","使用 AI 前，可以先明确这一步要产出什么、自己怎样判断它合格。随后观察真实结果，而不是把一次成功推广成能力保证。研究提供的是认识任务差异的视角；其中历史工具与职业情境的结果，不是今天每个人都能获得的收益预测。"]]},{"id":"S002","title":"用了 AI，为什么反而更慢？","reason":"把生成之外的检查和返工，也算进“提效”。","related":["S003","S011"],"sections":[["","得到第一份答案更快，不一定意味着整件事完成得更快。METR 的一项开发者实验让这个差别变得具体：在它研究的条件下，允许使用 AI 时，任务完成耗时反而增加了。"],["先看这是谁的工作","这项早期 2025 年的实验涉及 16 名熟悉各自项目的开源开发者，共 246 项任务。报告观察到，允许使用 AI 时，耗时增加 19%。这是特定参与者、项目和工具条件下的结果，不能直接用来描述今天所有开发者，或所有 AI 工作方式。"],["一个数字之后，还有研究的后续","2026 年 2 月，METR 说明后续实验受参与者选择、任务选择与并行工作计时等因素影响，难以可靠估计当时的加速幅度。5 月的另一项调查询问 349 名技术工作者的自报收益，进一步区分节省时间和创造更多价值。它使用的是问卷，和之前的实验耗时并非同一种测量。"],["回到自己的全程投入","对普通读者来说，这组材料提醒我们先说清楚“有用”的含义。它可能是更快完成原来的任务，也可能是更轻松，或能完成以前做不到的事。我们的实践建议是把说明需求、等待生成、检查结果和修改返工一起观察，再单独记录质量与体验。不同收益可以同时存在，不必挤进一个提效数字。"]]},{"id":"S003","title":"为什么测量 AI 提效变得更难了","reason":"研究方法的变化，决定新旧数字能否比较。","sections":[["","一项实验得到的结果，与它研究了谁、选择了什么任务、怎样计时紧密相关。工具和使用习惯发生变化后，再做一次实验，也不一定能得到可以直接对照的数字。"],["研究对象也在变化","METR 在 2026 年 2 月的方法更新中讨论了参与者和任务的选择，以及并行工作计时带来的困难。这些因素影响实验中实际被观察到的工作，使研究者难以可靠估计当时的加速幅度。"],["方法更新不等于结论反转","这篇文章属于此前开发者实验的后续研究线。它说明测量遇到了什么问题，并不构成一次同口径的“提效已经逆转”的证明。阅读研究进展时，应同时关心结果和产生结果的条件。"],["怎样理解前后不同的说法","我们的阅读建议是先确认比较对象和计时方式是否一致。对“某个实验中花了更多时间”和“有人认为自己获得了更多收益”，可以分别理解；把它们接成一条趋势线之前，需要更充分的共同测量基础。"]]},{"id":"S004","title":"人和 AI 一起做，就一定更好吗？","reason":"分清“帮到了我”和“实现了最佳组合”。","sections":[["","如果 AI 让你的结果比过去更好，这当然是一种帮助。但它是否意味着人和 AI 的组合已经是最好的安排？这里其实有两个不同的问题。"],["你在和谁比较","这项元分析汇总了 106 项实验，区分人机组合相对于人单独完成的改善，以及相对于人或 AI 中表现较强一方的改善。在纳入的研究中，组合平均优于人独做，却没有平均超过较强的那一方。改变比较基准，会改变“更好”的含义。"],["有参与，不自动等于有改善","把人放进流程，并不直接证明结果更好。这也不是说人没有价值。人的参与可能承担判断、责任、学习和体验等目的；这些目的需要分别说清楚，才能选择合适的评价方式。后面这些是我们由比较基准延伸出的策展思考。"],["一个可以带回任务的问题","如果你的目标是改善自己的工作，可以先与原有做法比较。如果希望证明一种分工更优，则需要比较更多安排。该研究纳入的是 2020 年至 2023 年 6 月的实验；它帮助我们厘清评价问题，而不是给当前所有 AI 排名。"]]},{"id":"S005","title":"普通人为什么总在反复改提示词","reason":"理解试错的困境，而不只背诵提示词技巧。","sections":[["","你可能见过这样的过程：改一句要求，得到满意的答案；下次照着做，却又不灵了。一次生成的成功，很容易让人误以为自己找到了稳定的方法。"],["研究看到了什么","这项 CHI 2023 用户研究观察了 10 名非 AI 专家为聊天机器人设计提示词的过程。它呈现了零散试错、把对人的指令方式类比到模型，以及根据少量结果过度推广等问题。"],["从感觉有效，到知道何时有效","由此出发，我们建议把一次满意输出当成线索，保留原来的任务、输入和评价要求，再看看方法换个例子是否仍然成立。若每次都同时更换措辞、材料和目标，也就很难知道哪个因素起了作用。"],["这份研究能帮助什么","它有助于识别普通用户面对不确定反馈时的交互困境。由于样本小、使用特定原型与旧模型，它不能给出今天普通用户的总体失败率，也不是一份最新提示词排行榜。"]]},{"id":"S006","title":"让 AI 理解你，需要怎样的背景","reason":"检查它拿到了什么信息，找到误解的来源。","sections":[["","一句要求写得再清楚，也未必包含完成任务所需的全部信息。你知道的读者是谁、哪些说法不能使用、什么样的结果算合适，AI 不一定都知道。"],["上下文里有什么","Anthropic 的工程文章把关注点放到指令、材料、示例和历史等信息的组织上。有效的上下文需要围绕具体任务筛选；检索和信息管理也是这项工作的组成部分。"],["把经验带回日常工作","以修改一篇文章为例，只说“更自然一点”，与提供目标读者、原稿和一个认可的段落，交给 AI 的条件并不相同。这个例子是我们的日常迁移：遇到返工时，可以先检查缺了哪些信息，再决定是否调整措辞。"],["充分不等于全部","信息量并不是唯一变量。材料是否相关、例子是否合适，同样值得关注。这篇文章提供厂商工程实践视角，没有证明任意任务都能通过添加背景获得固定幅度的提效。对自己的工作，仍需观察调整前后的真实结果。"]]},{"id":"S007","title":"什么时候需要一个自主行动的 AI？","reason":"先决定需要多大自主性，再增加流程复杂度。","sections":[["","让 AI 按事先安排的步骤做事，与让它在执行过程中决定下一步，是两种不同的委托。选择哪一种，要从眼前任务需要什么开始。"],["固定流程与自主探索","Anthropic 的工程文章区分预定义工作流和模型自主决策的 Agent，并讨论何时需要增加复杂度。这个区分为理解任务委托提供了一个实践视角：你的工作过程是否已经清楚，还是必须根据中间结果继续判断？"],["先把委托说具体","下面是我们的日常类比：整理一批格式一致的记录，可能适合明确步骤；围绕陌生问题寻找线索，过程则可能随新信息调整。这些例子用于解释两种工作方式，不是该文章验证过的场景结论。"],["复杂度应该服务任务","自主性更多，并不自动代表更适合。我们可以先说明希望交出的结果、需要由人决定的位置，再选择工作方式。原文发表于 2024 年，页面已提醒部分工具信息过时，本次只讨论定义与使用条件，不将其作为当前产品教程。"]]},{"id":"S008","title":"如何知道 AI 真的完成了任务","reason":"把它的完成声明，变成可以检查的结果。","sections":[["","“已经完成”是一句描述。文件是否存在、内容是否正确、是否符合原来的要求，则是需要分别检查的事情。只读 AI 的完成说明，可能还没有接触到真实产物。"],["验收先有对象和标准","Anthropic 关于 Agent 评估的文章介绍评估结构，以及规则、模型和人工等判分方式。工程实践中的关键问题，是让评价落到任务结果，而不是停在一段看起来可信的陈述。"],["不同检查方式看到不同问题","规则可以帮助检查明确条件，模型和人工判断可以参与更复杂的评价。把另一份 AI 意见加入检查，也仍然需要合适的标准与校准；它不是结果可靠的自动保证。"],["给自己的产物列出几项要求","作为日常迁移，可以先列出最关心的事实、格式和用途，再查看实际产物是否满足要求。没有统一答案的作品，还需要说明它为谁服务、什么样的表达合适。这些是策展建议，具体检查方式应与任务的错误成本相匹配。"]]},{"id":"S009","title":"使用 AI 时，我们把思考花在了哪里","reason":"看见生成之后，验证和整合仍然需要的劳动。","sections":[["","AI 提供了一份答案之后，工作未必就结束了。确认事实、判断能否用于当前情境、把不同部分整合起来，都可能继续占用人的注意力。"],["问卷记录了什么","这项研究收集了 319 名知识工作者提供的 936 个使用例子，关注他们自报的认知投入、信心与批判性思考活动。官方摘要涉及验证信息、整合结果和把握任务等活动。"],["劳动可能发生在另一个位置","一个值得带回自己的问题是：原来花在生成初稿上的精力，有多少转移到了检查、选择和整合？这是由材料引出的观察方向，不代表所有人的思考都以同一种方式变化。"],["不要跳过测量边界","自报问卷表达的是参与者的回忆与判断，相关关系也不等于因果。它不能证明 AI 导致思考能力退化。本页依据官方摘要整理，尚未核读论文全文，因此保留较窄的讨论范围。"]]},{"id":"S011","title":"除了更快，AI 还带来了什么价值","reason":"把节省时间与完成新事情，分开衡量。","sections":[["","一件事仍然花了半天，是否意味着 AI 没有帮助？答案取决于这半天完成了什么，以及过去能不能完成同样的结果。"],["效率之外的收益","METR 在 2026 年 5 月的调查中询问了 349 名技术工作者的使用体验，区分完成原任务更快与创造更多价值。这让“AI 有多大帮助”有了不止一个观察维度。"],["先说清楚想获得什么","我们由此建议，在自己的任务里分别记录耗时、结果质量和新增能力。节省了多少时间，与是否尝试了一件过去不会做的事，可以成为两项不同的收获，不需要互相替代。"],["问卷与实验分别说明什么","这份材料提供的是自报收益，而非实验测得的因果效果。它可以帮助理解人们怎样描述价值，但不能与早期开发者实验的耗时结果直接拼成工具进步曲线。"]]}],cover="data:image/webp;base64,UklGRlzTAQBXRUJQVlA4IFDTAQBQawedASoABgAEPm0ylkkkIqyuopFJ2dANiWlqdwCAO4C5k/e3XjzP+2fnp7Fn7V5e3y/uPQx/iv/f5c//3nM/lP/z6eHrLZxf+PzvfQP36v3/zX/1vq/6UVtN2VQPgbc5+atLX+Z/7mwv65/n//F/qecjz7+5/8P/Gfu5/h/Xn+W/9XiKeo/4z/0f6n4Af5l/U/ const main=document.querySelector('#main');
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const curated={delegate:['S001','S002','S004','S007'],intention:['S005','S006','S008'],judgment:['S008','S004','S009']};
const intros={delegate:['AI 能帮你做很多事，但不同任务、不同分工，结果并不相同。本专题从四个视角出发，判断哪些事值得交出去。','先理解任务差异，再把全程投入算清楚；最后厘清比较标准，选择合适的自主程度。'],intention:['反复修改，可能是缺少背景，也可能是需求仍在变化。这组文章从用户试错、上下文和验收标准三个角度，寻找误解的来源。'],judgment:['“看起来像成品”之后，还有一次真正的验收。这组文章讨论实际结果、人的贡献，以及验证和整合需要的思考。']};
const topicLabel=id=>'策展专题'+(id==='delegate'?' · 本期推荐':'');
const findArticle=id=>articles.find(a=>a.id===id);
const primary=curated.delegate;
// Per-history-entry navigation. A document can belong to several collections;
// its return destination is the actual entry point, never inferred membership.
let activePage=null,restoringPage=false,pageSerial=0;
const navigationKey='aiKnowReadingNavigationV1';
const currentHash=()=>location.hash||'#/';
function knownHash(hash){
 if(['#/','#/themes','#/topics','#/articles','#/about'].includes(hash))return true;
 return themes.some(t=>hash==='#/theme/'+t.id)||topics.some(t=>hash==='#/read/'+t.id)||articles.some(a=>hash==='#/material/'+a.id);
}
function writePageState(){
 try{history.replaceState({...history.state,[navigationKey]:activePage},'');}catch{}
}
function rememberPosition(){
 if(!activePage||restoringPage||activePage.hash!==currentHash())return;
 activePage.y=Math.max(0,scrollY);
 activePage.open=Array.from(document.querySelectorAll('main details')).map(d=>d.open);
 writePageState();
}
function beginPage(){
 const hash=currentHash(),saved=history.state?.[navigationKey];
 if(saved&&saved.hash===hash&&typeof saved.id==='string'){
  activePage={...saved,y:Number.isFinite(saved.y)?Math.max(0,saved.y):0,from:saved.from&&knownHash(saved.from.hash)?saved.from:null};
 }else{
  const from=activePage&&knownHash(activePage.hash)?{hash:activePage.hash,id:activePage.id}:null;
  activePage={id:Date.now()+'-'+(++pageSerial),hash,y:0,open:[],from};
  writePageState();
 }
 restoringPage=true;
}
function finishPage(){
 const id=activePage.id,y=activePage.y;
 document.querySelectorAll('main details').forEach((d,i)=>d.open=!!activePage.open?.[i]);
 main.focus({preventScroll:true});
 scrollTo({top:y,behavior:'instant'});
 requestAnimationFrame(()=>{
  if(activePage.id!==id)return;
  scrollTo({top:y,behavior:'instant'});
  restoringPage=false;progress();
 });
}
function returnTarget(){
 const hash=activePage?.from?.hash||'#/';
 let label='返回首页';
 if(hash==='#/topics')label='返回专题列表';
 else if(hash==='#/themes')label='返回母题目录';
 else if(hash==='#/articles')label='返回文章列表';
 else if(hash==='#/about')label='返回关于';
 else if(hash.startsWith('#/theme/'))label='返回'+(themes.find(t=>hash==='#/theme/'+t.id)?.name||'母题');
 else if(hash.startsWith('#/read/'))label='返回专题';
 else if(hash.startsWith('#/material/'))label='返回上一篇文章';
 return {hash,label};
}
function backLink(extraClass=''){
 const target=returnTarget();
 return '<a class="back '+extraClass+'" data-reader-back href="'+target.hash+'">← '+target.label+'</a>';
}
function returnToEntry(event){
 event.preventDefault();rememberPosition();
 if(activePage?.from){history.back();}
 else if(currentHash()!=='#/'){location.hash='#/';}
 else{scrollTo({top:0,behavior:'instant'});}
}
function navigationSection(){
 const origin=activePage?.from?.hash||'#/';
 if(origin.startsWith('#/theme'))return 'themes';
 if(origin.startsWith('#/read/')||origin==='#/topics')return 'topics';
 return 'home';
}
function installNavigation(){
 try{history.scrollRestoration='manual';}catch{}
 document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();});
 document.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  const a=e.target.closest('a[href^="#/"]');if(!a||a.target==='_blank'||a.hasAttribute('download'))return;
  if(a.hasAttribute('data-reader-back')){returnToEntry(e);return;}
  rememberPosition();
  if(a.getAttribute('href')===currentHash()){e.preventDefault();scrollTo({top:0,behavior:'instant'});}
 });
 window.addEventListener('hashchange',route);
 window.addEventListener('scroll',()=>{rememberPosition();progress();},{passive:true});
 window.addEventListener('pagehide',rememberPosition);
 document.addEventListener('toggle',rememberPosition,true);
 route();
}

function sourceOf(a){return sources.find(s=>s.id===a.id);}
function minutes(a){return Math.max(1,Math.ceil(a.sections.map(s=>s.join('')).join('').length/330));}
function item(a,index,reason=true){return '<a class="article-item" href="#/material/'+a.id+'"><div class="article-copy"><h3>'+esc(a.title)+'</h3><p>'+esc(a.reason)+'</p>'+(!reason?'<small>中文编读 · 约 '+minutes(a)+' 分钟</small>':'')+'</div><span class="article-mark" aria-hidden="true">'+String(index+1).padStart(2,'0')+'</span></a>';}
function miniThemes(){return '<nav class="themes-mini" aria-label="六个母题">'+themes.map(t=>'<a class="'+(t.id==='collaboration'?'live':'')+'" href="#/theme/'+t.id+'">'+t.name+'</a>').join('')+'</nav>';}
function issueCard(){return '<div class="issue-box"><a class="issue-head" href="#/read/delegate"><div><div class="tag">策展专题 / 人机协作</div><h3>什么事情<br>值得交给 AI？</h3><p>4 篇选读 · 09.15 更新</p></div><img class="issue-cover" src="'+cover+'" alt="纸张、铅笔与圆规，专题 AI 生成封面"></a><div class="issue-items">'+primary.slice(0,3).map((id,i)=>item(findArticle(id),i)).join('')+'</div><a class="issue-more" href="#/read/delegate">查看专题导读与全部 4 篇 →</a></div>';}
function home(){return '<div class="wrap"><header class="intro"><h1>值得读，也值得一直追问。</h1><p>围绕六个长期问题，持续精选值得读的 AI 研究、讨论与实践。</p></header>'+miniThemes()+'<div class="home-columns"><section class="section"><div class="section-head"><h2>本期推荐</h2><a href="#/topics">全部专题 →</a></div>'+issueCard()+'</section><section class="section"><div class="section-head"><h2>最近文章</h2><a href="#/articles">全部文章 →</a></div><div class="article-list">'+['S006','S008','S005'].map((id,i)=>item(findArticle(id),i,false)).join('')+'</div></section></div><aside class="commitment"><strong>每次回来，都能沿着同一个问题继续读。</strong><p>新文章归入母题，重要补充留有更新记录。来源与适用条件，随文章保留。</p><a href="#/about">了解我们的更新约定 →</a></aside></div>';}

function topicListing(){return '<div class="wrap page"><a class="back" href="#/">← 首页</a><header class="page-heading"><h1>策展专题</h1><p>从你关心的问题开始，读一组相互补充的文章。</p></header><div class="issue-list">'+topics.map(t=>'<a href="#/read/'+t.id+'"><div><span class="tag">'+topicLabel(t.id)+'</span><h2>'+t.title+'</h2><p>'+curated[t.id].length+' 篇选读 · 人机协作</p></div>'+(t.id==='delegate'?'<img class="issue-cover" src="'+cover+'" alt="专题封面">':'')+'</a>').join('')+'</div></div>';}

function issuePage(t){return '<div class="wrap page">'+backLink()+'<header class="page-heading"><div class="tag">'+topicLabel(t.id)+' / 人机协作</div><h1>'+t.title+'</h1><small>'+curated[t.id].length+' 篇选读 · 更新于 2026.09.15</small></header><div class="editorial">'+intros[t.id].map(p=>'<p>'+p+'</p>').join('')+'</div><section class="section"><div class="section-head"><h2>本组选读</h2><span class="tag">每篇一个选入理由</span></div><div class="article-list">'+curated[t.id].map((id,i)=>item(findArticle(id),i)).join('')+'</div><p class="issue-note">09.15 · 补充中文编读与来源说明。'+(t.id==='delegate'?'开发者实验一文同时介绍后续方法更新与自报调查。':'')+'</p></section><aside class="commitment secondary"><strong>这个问题，我们会继续追问。</strong><p>后续优先补入中文写作、资料整理与活动策划的实际过程，继续检验不同场景下的分工。</p></aside></div>';}
function sourceDetails(s){return '<dt>原文</dt><dd><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+' ↗</a></dd><dt>作者与时间</dt><dd>'+esc(s.by)+' · '+esc(s.pub||s.pubText)+'</dd><dt>核读范围</dt><dd>'+esc(s.read)+'；'+esc(s.where)+'</dd><dt>适用范围</dt><dd>'+esc(s.limit)+'</dd>';}
function articlePage(a){const s=sourceOf(a);return '<article class="reader page">'+backLink()+'<header><span class="tag">人机协作 · 中文编读</span><h1>'+a.title+'</h1><div class="byline"><span>AI know 编辑整理</span><span>约 '+minutes(a)+' 分钟</span><button class="font-button" aria-label="放大正文字号" aria-pressed="false">A＋</button></div></header><div class="body">'+a.sections.map(([h,p])=>(h?'<h2>'+esc(h)+'</h2>':'')+'<p>'+esc(p)+'</p>').join('')+'</div><details class="source"><summary>原文来源与编读说明</summary><dl><dt>内容说明</dt><dd>本页依据已核读材料撰写为中文编读，并非全文逐句译文。日常例子与建议为编辑延伸；原文信息核读截至 2026.09.11，编读更新于 2026.09.15。</dd>'+sourceDetails(s)+(a.related||[]).map(id=>sourceDetails(sources.find(s=>s.id===id))).join('')+'</dl></details><details class="notes"><summary>可选：留下一点想法</summary><label for="thought">这篇文章，让你想到什么？</label><textarea id="thought" placeholder="可以只写一句话。"></textarea><small id="save-status">仅保存在当前浏览器。</small><button id="download">下载我的记录 ↓</button></details><div class="read-next">'+backLink()+'</div></article>';}
function allArticles(){return '<div class="wrap page"><a class="back" href="#/">← 首页</a><header class="page-heading"><h1>最近文章</h1><p>本批编读更新于 09.15，同日按编辑推荐排列。</p></header><div class="article-list">'+['S006','S008','S005','S001','S002','S004','S007','S003','S009','S011'].map((id,i)=>item(findArticle(id),i,false)).join('')+'</div></div>';}
function about(){return '<div class="wrap page about"><a class="back" href="#/">← 首页</a><header class="page-heading"><h1>读懂 AI，也读懂正在变化的生活</h1></header><p>AI know 精选站是一份持续策划的知识体系，写给关心 AI，也关心自己的工作与生活将如何变化的人。</p><p>你可能正在尝试一种新的工作方式，也可能在思考：什么还值得学，哪些判断应该留给自己，我们与他人的关系又会怎样改变。这里希望为这些关切提供理解的线索。阅读可以从好奇开始，无须先成为技术专家。</p><h2>从纷杂的信息中，找到理解的线索</h2><p>关于 AI 的信息不断涌来，值得花时间阅读的内容，需要认真辨别。我们优先寻找一手的观点与研究，关注真实有人在做的实践：它解决了什么问题，在什么条件下有效，又遇到了哪些困难。比起辗转转述的结论和演示中的效果，我们更希望接近观点的出处与实践的现场。</p><p>筛选之后，我们按母题与具体问题组织材料，交代背景、建立关联，提供清晰的阅读入口。希望你面对庞大的信息时，能少一些四处搜寻与拼凑，多一些有脉络的阅读，逐步形成自己的理解与判断。</p><h2>六个母题，一起展开的知识地图</h2><p>AI 能力、人机协作、自我、关系与文化、工作与经济、权利与规则，构成我们长期关注的六个方向。从技术能做什么，到个人如何选择，再到共同生活的秩序，它们帮助我们理解变化发生在哪里，又如何彼此牵动。</p><p>每个策展专题从一个具体问题出发，按需要穿过不同母题，连接研究、播客、文章与一线经验。我们关心观点的依据，也关心经验成立的条件；保留有价值的分歧，让读者有空间形成自己的判断。</p><h2>一份可以持续回来的阅读</h2><p>我们对长期阅读的承诺，是持续筛选、连接与修订。新的证据会回到已有的问题中，新的实践会补充或修正原有的理解。来源与编辑说明随文章保留，让每一次阅读都有迹可循。</p><p>你可以从社媒上的一个问题走进来，在这里找到完整的阅读与后续讨论。希望随着一次次回来，你对 AI 的理解逐渐连贯，也更清楚自己愿意尝试什么、珍视什么，以及如何参与正在发生的变化。</p><a class="back" href="#/topics">从一个专题开始阅读 →</a></div>';}
function toast(text){const el=document.querySelector('.toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,2200);}
function bind(){const font=document.querySelector('.font-button');if(font)font.addEventListener('click',()=>{const on=document.querySelector('.reader').classList.toggle('large');font.textContent=on?'A−':'A＋';font.setAttribute('aria-pressed',String(on));font.setAttribute('aria-label',on?'恢复正文字号':'放大正文字号');});const thought=document.querySelector('#thought');if(thought){const key='ai-know-reading-'+location.hash;const status=document.querySelector('#save-status');try{thought.value=localStorage.getItem(key)||'';}catch{status.textContent='当前浏览器无法保存，可下载留存。';}thought.addEventListener('input',()=>{try{localStorage.setItem(key,thought.value);status.textContent='已保存在当前浏览器。';}catch{status.textContent='当前浏览器无法保存，可下载留存。';}});document.querySelector('#download').addEventListener('click',()=>{if(!thought.value.trim()){toast('先写下一点想法，再下载。');return;}const url=URL.createObjectURL(new Blob(['# '+document.querySelector('.reader h1').textContent+'\n\n'+thought.value],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='我的阅读记录.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});}}
function progress(){const bar=document.querySelector('.progress');const total=document.documentElement.scrollHeight-innerHeight;bar.style.width=location.hash.startsWith('#/material/')?(total>0?Math.min(100,scrollY/total*100):100)+'%':'0%';}
function route(){beginPage();let p;try{p=decodeURIComponent(location.hash.slice(1)||'/').split('/').filter(Boolean);}catch{p=['missing'];}let view,title='AI know 精选站',nav='home';if(!p.length){view=home();}else if(p[0]==='themes'){view=themesPage();title='六个母题 · '+title;nav='themes';}else if(p[0]==='theme'){const t=themes.find(t=>t.id===p[1]);if(t){view=themePage(t);title=t.name+' · '+title;nav='themes';}}else if(p[0]==='topics'){view=topicListing();title='策展 · '+title;nav='topics';}else if(p[0]==='read'){const t=topics.find(t=>t.id===p[1]);if(t){view=issuePage(t);title=t.title+' · '+title;nav='topics';}}else if(p[0]==='material'){const a=findArticle(p[1]);if(a){view=articlePage(a);title=a.title+' · '+title;nav=navigationSection();}}else if(p[0]==='articles'){view=allArticles();title='最近文章 · '+title;}else if(p[0]==='about'){view=about();nav='about';title='关于 · '+title;}if(!view)view='<div class="wrap page"><header class="page-heading"><h1>这一页还未收录。</h1></header><a href="#/">返回首页 →</a></div>';main.innerHTML=view;document.title=title;document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});bind();finishPage();}
installNavigation();
</script></body></html>
